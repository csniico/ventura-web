@if (isOpen()) {
  <!-- Backdrop -->
  <div
    class="fixed inset-0 bg-gray-900/50 z-50 transition-opacity"
    (click)="onBackdropClick($event)"
  >
    <!-- Modal -->
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div
        class="bg-white rounded-lg shadow-xl w-full max-w-md overflow-hidden"
        (click)="$event.stopPropagation()"
      >
        <!-- Content -->
        <div class="p-6">
          <!-- Icon -->
          <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">
            <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
          </div>

          <!-- Title -->
          <h3 class="text-lg font-semibold text-gray-900 text-center mb-2">
            Delete Appointment
          </h3>

          <!-- Description -->
          <p class="text-sm text-gray-500 text-center mb-2">
            Are you sure you want to delete this appointment?
          </p>

          @if (appointment()) {
            <p class="text-sm font-medium text-gray-900 text-center bg-gray-50 rounded-md py-2 px-3 mb-4">
              "{{ appointment()!.title }}"
            </p>
          }

          <p class="text-sm text-gray-500 text-center">
            This action cannot be undone.
          </p>

          <!-- Error Message -->
          @if (errorMessage()) {
            <div class="mt-4 rounded-md bg-red-50 p-3 border border-red-200">
              <p class="text-sm text-red-800 text-center">{{ errorMessage() }}</p>
            </div>
          }
        </div>

        <!-- Footer -->
        <div class="bg-gray-50 px-6 py-4 flex justify-end gap-3">
          <button
            type="button"
            (click)="onCancel()"
            [disabled]="isDeleting()"
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
          >
            Cancel
          </button>
          <button
            type="button"
            (click)="onConfirm()"
            [disabled]="isDeleting()"
            class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-red-600 border border-transparent rounded-md shadow-sm hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
          >
            @if (isDeleting()) {
              <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Deleting...
            } @else {
              Delete
            }
          </button>
        </div>
      </div>
    </div>
  </div>
}
