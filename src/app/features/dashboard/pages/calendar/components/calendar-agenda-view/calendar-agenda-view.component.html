<div class="flex-1 overflow-y-auto p-4 sm:p-6">
  @if (groups().length === 0) {
    <!-- Empty state -->
    <div class="flex flex-col items-center justify-center py-16 text-center">
      <div class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center mb-4">
        <svg class="w-7 h-7 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
      </div>
      <h3 class="text-base font-semibold text-gray-900">No appointments</h3>
      <p class="text-sm text-gray-500 mt-1 mb-4">Nothing scheduled yet.</p>
      <button
        type="button"
        (click)="createAppointment.emit()"
        class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        New Appointment
      </button>
    </div>
  } @else {
    <div class="mx-auto max-w-3xl space-y-6">
      @for (group of groups(); track group.key) {
        <div>
          <h3 class="text-sm font-semibold text-gray-500 mb-2">{{ group.label }}</h3>
          <div class="bg-white border border-gray-200 rounded-lg divide-y divide-gray-100">
            @for (apt of group.appointments; track apt.id) {
              <button
                type="button"
                (click)="onAppointmentClick(apt)"
                class="w-full flex items-center gap-4 p-4 text-left hover:bg-gray-50 transition-colors first:rounded-t-lg last:rounded-b-lg"
              >
                <div class="w-28 shrink-0 text-sm text-gray-600">
                  {{ formatTimeRange(apt.startTime, apt.endTime) }}
                </div>
                <div class="min-w-0 flex-1">
                  <p class="text-sm font-medium text-gray-900 truncate">{{ apt.title }}</p>
                  <div class="mt-0.5 flex flex-wrap items-center gap-2 text-xs text-gray-400">
                    @if (apt.location) {
                      <span class="inline-flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        {{ apt.location }}
                      </span>
                    }
                    @if (apt.isRecurring) {
                      <span>· Recurring</span>
                    }
                  </div>
                </div>
                <span
                  class="inline-flex items-center px-2.5 py-1 text-xs font-medium rounded-full capitalize"
                  [ngClass]="statusClasses(apt.status)"
                >
                  {{ apt.status }}
                </span>
              </button>
            }
          </div>
        </div>
      }
    </div>
  }
</div>
