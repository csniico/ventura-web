<div class="flex items-center justify-between px-5 py-4 border-b border-gray-200 bg-white rounded-t-lg">
  <!-- Left: Navigation -->
  <div class="flex items-center gap-4">
    <button
      (click)="goToToday()"
      class="px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 transition-colors"
    >
      Today
    </button>
    <div class="flex items-center">
      <button
        (click)="navigatePrev()"
        class="p-1.5 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-md transition-colors"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <button
        (click)="navigateNext()"
        class="p-1.5 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-md transition-colors"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
    <h2 class="text-lg font-semibold text-gray-900">{{ monthYearLabel() }}</h2>
  </div>

  <!-- Center: View Mode Selector -->
  <div class="hidden sm:flex items-center bg-gray-100 rounded-lg p-0.5">
    <button
      (click)="setViewMode('month')"
      class="px-3 py-1.5 text-sm font-medium rounded-md transition-colors"
      [class.bg-white]="viewMode() === 'month'"
      [class.text-gray-900]="viewMode() === 'month'"
      [class.shadow-sm]="viewMode() === 'month'"
      [class.text-gray-600]="viewMode() !== 'month'"
    >
      Month
    </button>
    <button
      (click)="setViewMode('week')"
      class="px-3 py-1.5 text-sm font-medium rounded-md transition-colors"
      [class.bg-white]="viewMode() === 'week'"
      [class.text-gray-900]="viewMode() === 'week'"
      [class.shadow-sm]="viewMode() === 'week'"
      [class.text-gray-600]="viewMode() !== 'week'"
    >
      Week
    </button>
    <button
      (click)="setViewMode('day')"
      class="px-3 py-1.5 text-sm font-medium rounded-md transition-colors"
      [class.bg-white]="viewMode() === 'day'"
      [class.text-gray-900]="viewMode() === 'day'"
      [class.shadow-sm]="viewMode() === 'day'"
      [class.text-gray-600]="viewMode() !== 'day'"
    >
      Day
    </button>
  </div>

  <!-- Right: New Appointment Button -->
  <button
    (click)="openNewAppointment()"
    class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors shadow-sm"
  >
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
    </svg>
    <span class="hidden sm:inline">New Appointment</span>
  </button>
</div>
