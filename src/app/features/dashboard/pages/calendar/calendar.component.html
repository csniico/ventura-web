<div class="h-full flex flex-col">
  <!-- Loading Overlay -->
  @if (isLoading()) {
    <div class="absolute inset-0 bg-white/50 flex items-center justify-center z-10">
      <div class="flex items-center gap-3">
        <svg class="animate-spin h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="text-gray-600 font-medium">Loading appointments...</span>
      </div>
    </div>
  }

  <!-- Calendar Header -->
  <app-calendar-header />

  <!-- Calendar Content -->
  @switch (viewMode()) {
    @case ('month') {
      <app-calendar-grid
        (dayClick)="onDayClick($event)"
        (appointmentClick)="onAppointmentClick($event)"
      />
    }
    @case ('week') {
      <app-calendar-week-view
        (dayClick)="onDayClick($event)"
        (appointmentClick)="onAppointmentClick($event)"
      />
    }
    @case ('day') {
      <app-calendar-day-view
        (timeSlotClick)="onDayClick($event)"
        (appointmentClick)="onAppointmentClick($event)"
      />
    }
  }
</div>

<!-- Appointment Modal -->
<app-appointment-modal />

<!-- Delete Confirmation Modal -->
<app-delete-confirmation-modal />
